<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="description" content="A simple form for submitting product reviews">
    <meta name="author" content="Marcio Augusto De Carvalho Belucci">
    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review Form</h1>
    </header>
    <main>
        <form id="review-form" action="review.html" method="get">
            <div class="form-group">
                <label for="product-name">Product Name:</label>
                <select id="product-name" name="product-name" required>
                    <option value="" disabled selected>Select a product</option>
                </select>
            </div>

            <fieldset class="form-group rafting">
                <legend>Overall Rating</legend>
                <div class="stars">
                    <div class="star-item">
                        <label for="fivestar">&#9734;&#9734;&#9734;&#9734;&#9734;</label>
                        <input type="radio" id="fivestar" name="stars" value="5" required>
                    </div>
                    <div class="star-item">
                        <label for="fourstar">&#9734;&#9734;&#9734;&#9734;</label>
                        <input type="radio" id="fourstar" name="stars" value="4" required>
                    </div>
                    <div class="star-item">
                        <label for="threestar">&#9734;&#9734;&#9734;</label>
                        <input type="radio" id="threestar" name="stars" value="3" required>
                    </div>
                    <div class="star-item">
                        <label for="twostar">&#9734;&#9734;</label>
                        <input type="radio" id="twostar" name="stars" value="2" required>
                    </div>
                    <div class="star-item">
                        <label for="onestar">&#9734;</label>
                        <input type="radio" id="onestar" name="stars" value="1" required>
                    </div>
                </div>
            </fieldset>

            <div class="form-group">
                <label for="date-installation">Date of Installation:</label>
                <input type="date" id="date-installation" name="date-installation" required>
            </div>

            <fieldset class="form-group">
                <legend>Which features did you find useful in the product?<br>(Check all that apply):</legend>
                <div>
                    <input type="checkbox" id="durability" name="features">
                    <label for="durability">Durability</label>
                </div>
                <div>
                    <input type="checkbox" id="ease-of-use" name="features">
                    <label for="ease-of-use">Ease of Use</label>
                </div>
                <div>
                    <input type="checkbox" id="performance" name="features">
                    <label for="performance">Performance</label>
                </div>
                <div>
                    <input type="checkbox" id="design" name="features">
                    <label for="design">Design</label>
                </div>
            </fieldset>

            <div class="form-group">
                <label for="review-text">Review:</label>
                <textarea id="review-text" name="review-text" rows="4" ></textarea>
            </div>

            <div class="form-group">
                <label for="reviewer-name">Your Name:</label>
                <input type="text" id="reviewer-name" name="reviewer-name" required>
            </div>

            <div class="form-group">
                <button type="submit">Post Review</button>
            </div>

        </form>
    </main>
    <footer>
        <p>&copy;<span id="currentyear"></span> Marcio Augusto De Carvalho Belucci - São Paulo, Brazil</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
